<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Accommodation - Rooms</title>
    <link rel="stylesheet" href="style-rooms.css">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="rooms.html">Rooms</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Rooms Section -->
    <section id="rooms">
        <h2>Available Rooms</h2>

        <div class="room-list" id="roomList">
            
            <!-- Room 1 -->
            <a href="shared-room.html" class="room-link">
                <div class="room" data-status="Available">
                    <span class="badge available">Available</span>
                    <img src="shared bed.webp" alt="Single Room">
                    <h3>Shared Flat</h3>
                    <p>£650/month</p>
                </div>
            </a>

            <!-- Room 2 -->
            <a href="flat.html" class="room-link">
                <div class="room" data-status="Available">
                    <span class="badge booked">Available</span>
                    <img src="1-bed-flat.webp" alt="1-Bed Flat">
                    <h3>1 Bed-Flat</h3>
                    <p>£800/month</p>
                </div>
            </a>

        </div>
    </section>

    <script src="rooms.js"></script>

</body>
</html>
